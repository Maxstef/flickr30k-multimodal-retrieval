name: flickr30k

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.11

  # Core
  - numpy=1.26.4
  - pandas=2.3.1
  - scipy=1.16.1
  - scikit-learn=1.7.1
  - matplotlib=3.10.5

  # Deep Learning
  - pytorch=2.2.2
  - torchvision=0.17.2

  # Notebook
  - jupyter
  - notebook

  # Utilities
  - pillow
  - pip

  # Packages installed via pip
  - pip:
      - numpy==1.26.4
      - streamlit==1.58.0
      - datasets==3.6.0
      - tqdm==4.68.3
      - fastapi=0.139.2
      - uvicorn[standard]=0.50.2